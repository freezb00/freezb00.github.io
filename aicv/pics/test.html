<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cozy Modern 3D Studio - 现代温馨3D室内场景</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #161922;
            color: #f8fafc;
        }

        #app {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #262c3a 0%, #141720 100%);
        }

        #canvas-wrap {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }

        #canvas-wrap:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        /* Glassmorphism UI Bars */
        .ui-bar-top {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            pointer-events: none;
        }

        .ui-bar-bottom {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            max-width: 96vw;
            pointer-events: none;
        }

        .glass-card {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.76);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.4);
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(52, 211, 153, 0.4);
            color: #6ee7b7;
        }

        .brand-sub {
            font-size: 11px;
            color: #cbd5e1;
            margin-top: 1px;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 5px;
            padding: 6px 8px;
        }

        .bottom-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .bottom-row::-webkit-scrollbar {
            display: none;
        }

        .divider {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.16);
            margin: 0 3px;
        }

        .btn {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.07);
            color: #e2e8f0;
            font-size: 12px;
            font-weight: 500;
            padding: 6px 11px;
            border-radius: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            transition: all 0.18s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
            color: #ffffff;
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.active {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-color: rgba(255, 255, 255, 0.45);
            color: #ffffff;
            box-shadow: 0 3px 12px rgba(99, 102, 241, 0.45);
        }

        .btn.active-warm {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-color: rgba(255, 255, 255, 0.45);
            color: #ffffff;
            box-shadow: 0 3px 12px rgba(245, 158, 11, 0.4);
        }

        /* Hover 3D Object Label */
        #hover-label {
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -135%);
            z-index: 40;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.14s ease;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(56, 189, 248, 0.45);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 8px #38bdf8;
        }

        /* Toast Notification */
        #toast-pill {
            position: fixed;
            top: 74px;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            z-index: 35;
            pointer-events: none;
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            color: #fde68a;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(251, 191, 36, 0.35);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        #toast-pill.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 700px) {
            .brand-sub { display: none; }
            .btn { padding: 5px 8px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="canvas-wrap"></div>

        <!-- Top Navigation & Mode Controls -->
        <header class="ui-bar-top">
            <div class="glass-card brand-box">
                <div class="brand-icon">🏠</div>
                <div>
                    <div class="brand-title">
                        <span>3D 现代温馨室内场景</span>
                        <span id="engine-status" class="status-badge">正在初始化...</span>
                    </div>
                    <div class="brand-sub">左键旋转 · 右键平移 · 滚轮缩放 · 点击家具直接互动</div>
                </div>
            </div>

            <div class="glass-card controls-row">
                <!-- Atmosphere Lighting Modes -->
                <button class="btn active" id="mode-day" onclick="switchAtmosphere('day')">☀️ 午后暖阳</button>
                <button class="btn" id="mode-night" onclick="switchAtmosphere('night')">🌙 静谧夜晚</button>
                <button class="btn" id="mode-cyber" onclick="switchAtmosphere('cyber')">⚡ 赛博霓虹</button>

                <div class="divider"></div>

                <!-- Camera View Presets -->
                <button class="btn active" id="cam-panorama" onclick="moveCameraTo('panorama')">🏠 全景视图</button>
                <button class="btn" id="cam-desk" onclick="moveCameraTo('desk')">💻 极客桌搭</button>
                <button class="btn" id="cam-sofa" onclick="moveCameraTo('sofa')">🛋️ 沙发阅读</button>
                <button class="btn" id="cam-window" onclick="moveCameraTo('window')">🪟 窗边光影</button>
            </div>
        </header>

        <!-- Center Toast Feedback -->
        <div id="toast-pill">✨ 欢迎来到 3D 现代温馨工作室</div>

        <!-- Mouse Hover Tooltip -->
        <div id="hover-label">
            <span class="pulse-dot"></span>
            <span id="hover-text">点击交互</span>
        </div>

        <!-- Bottom Quick Interactive Toolbar -->
        <footer class="ui-bar-bottom">
            <div class="glass-card bottom-row">
                <button class="btn active-warm" id="btn-floor-lamp" onclick="toggleFloorLamp()">🏮 钓鱼落地灯</button>
                <button class="btn active-warm" id="btn-desk-lamp" onclick="toggleDeskLamp()">🔦 黄铜台灯</button>
                <button class="btn" onclick="cycleMonitorTheme()">🖥️ 切换双联屏</button>
                <button class="btn" onclick="triggerChairSpin()">🪑 旋转工学椅</button>
                <button class="btn active" id="btn-blinds" onclick="toggleWindowBlinds()">🪟 百叶窗开合</button>
                <button class="btn active-warm" id="btn-vinyl" onclick="toggleVinylPlayer()">🎵 黑胶唱片机</button>
            </div>
        </footer>
    </div>

    <script>
        // Multi-CDN Loader for Three.js r128 to guarantee 100% availability
        const THREE_CDNS = [
            "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
            "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js",
            "https://unpkg.com/three@0.128.0/build/three.min.js"
        ];

        function loadThreeJS(index, onSuccess, onFailure) {
            if (window.THREE) {
                onSuccess();
                return;
            }
            if (index >= THREE_CDNS.length) {
                onFailure();
                return;
            }
            const script = document.createElement('script');
            script.src = THREE_CDNS[index];
            script.async = true;
            script.onload = () => {
                if (window.THREE) onSuccess();
                else loadThreeJS(index + 1, onSuccess, onFailure);
            };
            script.onerror = () => {
                loadThreeJS(index + 1, onSuccess, onFailure);
            };
            document.head.appendChild(script);
        }

        // Global Scene & State Variables
        let scene, camera, renderer, clock;
        let raycaster, pointerNDC;
        const interactableMeshes = [];
        let hoveredGroup = null;

        // Interactive Room State
        const roomState = {
            mode: 'day',            // 'day' | 'night' | 'cyber'
            floorLampOn: true,
            deskLampOn: true,
            blindsOpen: true,
            vinylPlaying: true,
            monitorMode: 0,         // 0: VS Code, 1: Synthwave Audio, 2: 3D Engine Node
            chairTargetYaw: 0.45,
            mugBounceTime: -10
        };

        // Custom Spherical Orbit Controller (Guaranteed Never to Clip Behind Walls)
        // theta = 0 is +Z, theta = PI/2 is +X. Both Left Wall (-X) and Back Wall (-Z) stay strictly behind the scene!
        const camControl = {
            target: { x: 0, y: 1.55, z: 0 },
            currentTarget: { x: 0, y: 1.55, z: 0 },
            theta: Math.PI * 0.25,        // Horizontal angle (45 deg front-right isometric)
            phi: 1.08,                    // Vertical angle from +Y axis
            radius: 14.2,                 // Distance from target
            currentTheta: Math.PI * 0.25,
            currentPhi: 1.08,
            currentRadius: 14.2,
            minTheta: 0.08,               // Prevents going behind Back Wall (Z = -5)
            maxTheta: Math.PI * 0.47,     // Prevents going behind Left Wall (X = -5)
            minPhi: 0.32,                 // Top-down limit
            maxPhi: Math.PI * 0.47,       // Floor-level limit
            minRadius: 5.2,
            maxRadius: 22.5,
            isDragging: false,
            dragButton: 0,
            prevX: 0,
            prevY: 0,
            downX: 0,
            downY: 0
        };

        const CAMERA_PRESETS = {
            panorama: { theta: Math.PI * 0.25, phi: 1.08, radius: 14.2, target: { x: 0.0, y: 1.55, z: 0.0 } },
            desk:     { theta: 0.30,           phi: 1.15, radius: 6.8,  target: { x: 1.3, y: 1.85, z: -3.4 } },
            sofa:     { theta: 1.05,           phi: 1.14, radius: 7.4,  target: { x: -2.8, y: 1.25, z: 1.2 } },
            window:   { theta: 1.18,           phi: 1.18, radius: 8.2,  target: { x: -3.2, y: 2.20, z: 0.5 } }
        };

        // Scene Object References for Animation & Lighting
        const lights = {};
        const materials = {};
        const animObjects = {
            pcFans: [],
            steamParticles: [],
            blindsSlats: [],
            chairTopGroup: null,
            mugGroup: null,
            vinylDisc: null,
            vinylTonearm: null,
            godRaysGroup: null,
            skyBackdropMat: null,
            starsGroup: null,
            deskRgbMat: null,
            coveLightMat: null,
            monCanvasL: null,
            monCtxL: null,
            monTexL: null,
            monCanvasR: null,
            monCtxR: null,
            monTexR: null
        };

        function fillRoundRect(ctx, x, y, w, h, r) {
            const radius = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + w - radius, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
            ctx.lineTo(x + w, y + h - radius);
            ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
            ctx.lineTo(x + radius, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        // 1. Warm Oak Herringbone Parquet Floor Texture
        function createOakFloorTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#b98556';
            ctx.fillRect(0, 0, 1024, 1024);

            const rows = 16;
            const cols = 8;
            const w = 1024 / cols;
            const h = 1024 / rows;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = c * w + (r % 2 === 0 ? 0 : w * 0.5) - w * 0.5;
                    const y = r * h;
                    const tone = ((r * 11 + c * 17) % 22) - 11;

                    ctx.fillStyle = `rgb(${188 + tone}, ${135 + Math.floor(tone * 0.8)}, ${88 + Math.floor(tone * 0.6)})`;
                    ctx.fillRect(x + 2, y + 2, w - 4, h - 4);

                    // Subtle Wood Grain
                    ctx.strokeStyle = 'rgba(72, 38, 14, 0.14)';
                    ctx.lineWidth = 1.5;
                    for (let g = 0; g < 4; g++) {
                        const gy = y + 8 + (g * (h - 14)) / 4;
                        ctx.beginPath();
                        ctx.moveTo(x + 4, gy);
                        ctx.bezierCurveTo(x + w * 0.35, gy + 3, x + w * 0.65, gy - 3, x + w - 4, gy);
                        ctx.stroke();
                    }

                    ctx.strokeStyle = 'rgba(58, 32, 12, 0.32)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2.2, 2.2);
            return tex;
        }

        // 2. Nordic Geometric Woven Rug Texture
        function createNordicRugTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 768;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#f4efe6';
            ctx.fillRect(0, 0, 1024, 768);

            // Woven horizontal fibers
            ctx.fillStyle = 'rgba(0,0,0,0.025)';
            for (let y = 0; y < 768; y += 6) {
                ctx.fillRect(0, y, 1024, 2);
            }

            // Terracotta Arch
            ctx.fillStyle = '#d96b43';
            ctx.beginPath();
            ctx.arc(320, 410, 200, Math.PI, 0);
            ctx.lineTo(520, 680);
            ctx.lineTo(120, 680);
            ctx.closePath();
            ctx.fill();

            // Sage Green Sun
            ctx.fillStyle = '#6b8e78';
            ctx.beginPath();
            ctx.arc(680, 270, 160, 0, Math.PI * 2);
            ctx.fill();

            // Mustard Block
            ctx.fillStyle = '#e09f3e';
            ctx.fillRect(520, 420, 350, 230);

            // Minimalist Charcoal Line Border
            ctx.strokeStyle = '#2b3a4a';
            ctx.lineWidth = 10;
            ctx.strokeRect(40, 40, 944, 688);

            ctx.beginPath();
            ctx.arc(320, 250, 80, 0, Math.PI * 2);
            ctx.stroke();

            return new THREE.CanvasTexture(canvas);
        }

        // 3. Framed Wall Art Textures
        function createWallArtTexture(idx) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 640;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#faf8f5';
            ctx.fillRect(0, 0, 512, 640);

            if (idx === 0) {
                ctx.fillStyle = '#ede0d4';
                ctx.fillRect(44, 44, 424, 552);
                ctx.fillStyle = '#d96b43';
                ctx.beginPath();
                ctx.arc(256, 250, 115, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#264653';
                ctx.beginPath();
                ctx.moveTo(44, 596);
                ctx.quadraticCurveTo(256, 360, 468, 596);
                ctx.fill();
            } else if (idx === 1) {
                ctx.fillStyle = '#e2ece9';
                ctx.fillRect(44, 44, 424, 552);
                ctx.fillStyle = '#2a9d8f';
                ctx.beginPath();
                ctx.ellipse(256, 330, 105, 175, 0.22, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(195, 520);
                ctx.quadraticCurveTo(256, 320, 310, 140);
                ctx.stroke();
            } else {
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(44, 44, 424, 552);
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(92, 96, 170, 210);
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(325, 405, 95, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#f8fafc';
                ctx.lineWidth = 7;
                ctx.strokeRect(140, 210, 230, 260);
            }

            return new THREE.CanvasTexture(canvas);
        }

        // 4. Live Dual Monitor Screen Renderer
        function renderMonitorCanvases(t) {
            if (!animObjects.monCtxL || !animObjects.monCtxR) return;
            const ctxL = animObjects.monCtxL;
            const ctxR = animObjects.monCtxR;
            const w = 512, h = 288;
            const mode = roomState.monitorMode;

            // Left Screen
            if (mode === 0) {
                // VS Code IDE
                ctxL.fillStyle = '#0f172a';
                ctxL.fillRect(0, 0, w, h);
                ctxL.fillStyle = '#1e293b';
                ctxL.fillRect(0, 0, 82, h);
                for (let i = 0; i < 6; i++) {
                    ctxL.fillStyle = i === 1 ? '#38bdf8' : '#475569';
                    ctxL.fillRect(14, 24 + i * 24, 52, 8);
                }
                const colors = ['#f472b6', '#38bdf8', '#a78bfa', '#34d399', '#fbbf24'];
                for (let r = 0; r < 10; r++) {
                    const y = 22 + r * 24;
                    let cx = 104 + (r % 3) * 18;
                    for (let s = 0; s < 3; s++) {
                        const bw = 34 + ((r * 17 + s * 29) % 62);
                        ctxL.fillStyle = colors[(r + s) % colors.length];
                        ctxL.fillRect(cx, y, bw, 9);
                        cx += bw + 10;
                    }
                    if (r === 5 && Math.sin(t * 6) > 0) {
                        ctxL.fillStyle = '#ffffff';
                        ctxL.fillRect(cx, y - 2, 3, 13);
                    }
                }
            } else if (mode === 1) {
                // Synthwave Equalizer
                const grad = ctxL.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#1e1b4b');
                grad.addColorStop(0.55, '#701a75');
                grad.addColorStop(1, '#090d16');
                ctxL.fillStyle = grad;
                ctxL.fillRect(0, 0, w, h);

                ctxL.fillStyle = '#f43f5e';
                ctxL.beginPath();
                ctxL.arc(w / 2, h * 0.42, 60, 0, Math.PI * 2);
                ctxL.fill();

                for (let b = 0; b < 26; b++) {
                    const bh = 18 + Math.abs(Math.sin(t * 4.2 + b * 0.45)) * 115;
                    ctxL.fillStyle = b % 2 === 0 ? '#22d3ee' : '#f472b6';
                    ctxL.fillRect(28 + b * 17.5, h - bh - 14, 11, bh);
                }
            } else {
                // 3D Engine Node Graph
                ctxL.fillStyle = '#09131c';
                ctxL.fillRect(0, 0, w, h);
                ctxL.strokeStyle = 'rgba(56, 189, 248, 0.15)';
                ctxL.lineWidth = 1;
                for (let gx = 0; gx < w; gx += 32) {
                    ctxL.beginPath(); ctxL.moveTo(gx, 0); ctxL.lineTo(gx, h); ctxL.stroke();
                }
                for (let gy = 0; gy < h; gy += 32) {
                    ctxL.beginPath(); ctxL.moveTo(0, gy); ctxL.lineTo(w, gy); ctxL.stroke();
                }
                ctxL.strokeStyle = '#10b981';
                ctxL.lineWidth = 3;
                ctxL.beginPath();
                ctxL.arc(256, 144, 68 + Math.sin(t * 3) * 8, 0, Math.PI * 2);
                ctxL.stroke();
            }

            // Right Screen: System Telemetry & Waveform
            ctxR.fillStyle = '#090d16';
            ctxR.fillRect(0, 0, w, h);
            ctxR.fillStyle = '#1e293b';
            fillRoundRect(ctxR, 18, 18, 225, 130, 8);
            fillRoundRect(ctxR, 260, 18, 234, 130, 8);

            ctxR.strokeStyle = mode === 1 ? '#f472b6' : (mode === 2 ? '#10b981' : '#38bdf8');
            ctxR.lineWidth = 3;
            ctxR.beginPath();
            for (let x = 0; x < 190; x += 6) {
                const y = 82 + Math.sin(t * 4.2 + x * 0.06) * 32;
                if (x === 0) ctxR.moveTo(35 + x, y);
                else ctxR.lineTo(35 + x, y);
            }
            ctxR.stroke();

            ctxR.strokeStyle = '#a855f7';
            ctxR.lineWidth = 4;
            ctxR.beginPath();
            ctxR.arc(377, 82, 42, t * 2, t * 2 + Math.PI * 1.45);
            ctxR.stroke();

            ctxR.fillStyle = '#111827';
            fillRoundRect(ctxR, 18, 164, 476, 106, 8);
            for (let i = 0; i < 4; i++) {
                ctxR.fillStyle = i === 3 ? '#34d399' : '#64748b';
                const bw = 110 + ((i * 77 + Math.floor(t * 12)) % 280);
                ctxR.fillRect(34, 182 + i * 20, bw, 8);
            }

            animObjects.monTexL.needsUpdate = true;
            animObjects.monTexR.needsUpdate = true;
        }

        function init3DStudio() {
            const wrap = document.getElementById('canvas-wrap');
            const width = Math.max(wrap.clientWidth || window.innerWidth || 960, 320);
            const height = Math.max(wrap.clientHeight || window.innerHeight || 640, 280);

            clock = new THREE.Clock();
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xdbeafe);
            scene.fog = new THREE.FogExp2(0xdbeafe, 0.014);

            camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 120);
            updateCameraTransform();

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.08;

            wrap.innerHTML = '';
            wrap.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            pointerNDC = new THREE.Vector2();

            setupLights();
            buildRoomArchitecture();
            buildLoungeArea();
            buildWorkspaceArea();
            buildWallShelvesAndCredenza();

            switchAtmosphere('day', true);
            bindEvents(renderer.domElement);

            const badge = document.getElementById('engine-status');
            if (badge) badge.textContent = 'WebGL 实时渲染中';

            animateLoop();
        }

        function registerInteractableGroup(group, type, label) {
            group.userData.interactType = type;
            group.userData.interactLabel = label;
            group.traverse((child) => {
                if (child.isMesh) {
                    child.userData.interactGroup = group;
                    interactableMeshes.push(child);
                }
            });
        }

        function setupLights() {
            lights.hemi = new THREE.HemisphereLight(0xffffff, 0xc29b61, 0.75);
            lights.hemi.position.set(0, 12, 0);

            lights.sun = new THREE.DirectionalLight(0xfffbeb, 1.35);
            lights.sun.position.set(-12, 10, 2.5);
            lights.sun.castShadow = true;
            lights.sun.shadow.mapSize.width = 2048;
            lights.sun.shadow.mapSize.height = 2048;
            lights.sun.shadow.camera.near = 2;
            lights.sun.shadow.camera.far = 28;
            const d = 7.5;
            lights.sun.shadow.camera.left = -d;
            lights.sun.shadow.camera.right = d;
            lights.sun.shadow.camera.top = d;
            lights.sun.shadow.camera.bottom = -d;
            lights.sun.shadow.bias = -0.0005;

        function moveCameraTo(presetKey) {
            const p = CAMERA_PRESETS[presetKey];
            if (!p) return;

            ['panorama', 'desk', 'sofa', 'window'].forEach(k => {
                const btn = document.getElementById(`cam-${k}`);
                if (btn) btn.classList.toggle('active', k === presetKey);
            });

            camControl.theta = p.theta;
            camControl.phi = p.phi;
            camControl.radius = p.radius;
            camControl.target.x = p.target.x;
            camControl.target.y = p.target.y;
            camControl.target.z = p.target.z;
        }

        function updateCameraTransform() {
            // Smooth damping interpolation
            camControl.currentTheta += (camControl.theta - camControl.currentTheta) * 0.09;
            camControl.currentPhi += (camControl.phi - camControl.currentPhi) * 0.09;
            camControl.currentRadius += (camControl.radius - camControl.currentRadius) * 0.09;

            camControl.currentTarget.x += (camControl.target.x - camControl.currentTarget.x) * 0.09;
            camControl.currentTarget.y += (camControl.target.y - camControl.currentTarget.y) * 0.09;
            camControl.currentTarget.z += (camControl.target.z - camControl.currentTarget.z) * 0.09;

            const r = camControl.currentRadius;
            const sinPhi = Math.sin(camControl.currentPhi);
            const cosPhi = Math.cos(camControl.currentPhi);
            const sinTheta = Math.sin(camControl.currentTheta);
            const cosTheta = Math.cos(camControl.currentTheta);

            camera.position.set(
                camControl.currentTarget.x + r * sinPhi * sinTheta,
                camControl.currentTarget.y + r * cosPhi,
                camControl.currentTarget.z + r * sinPhi * cosTheta
            );
            camera.lookAt(camControl.currentTarget.x, camControl.currentTarget.y, camControl.currentTarget.z);
        }

        function bindEvents(domElement) {
            domElement.addEventListener('contextmenu', e => e.preventDefault());

            domElement.addEventListener('pointerdown', e => {
                camControl.isDragging = true;
                camControl.dragButton = e.button;
                camControl.prevX = e.clientX;
                camControl.prevY = e.clientY;
                camControl.downX = e.clientX;
                camControl.downY = e.clientY;
            });

            window.addEventListener('pointermove', e => {
                if (camControl.isDragging) {
                    const dx = e.clientX - camControl.prevX;
                    const dy = e.clientY - camControl.prevY;
                    camControl.prevX = e.clientX;
                    camControl.prevY = e.clientY;

                    if (camControl.dragButton === 0) {
                        // Left button: Orbit within safe front-right quadrant
                        camControl.theta = Math.max(
                            camControl.minTheta,
                            Math.min(camControl.maxTheta, camControl.theta - dx * 0.0055)
                        );
                        camControl.phi = Math.max(
                            camControl.minPhi,
                            Math.min(camControl.maxPhi, camControl.phi - dy * 0.0055)
                        );
                    } else {
                        // Right button: Pan target smoothly within room bounds
                        camControl.target.x = Math.max(-3.5, Math.min(3.5, camControl.target.x - dx * 0.01));
                        camControl.target.y = Math.max(0.5, Math.min(3.5, camControl.target.y + dy * 0.01));
                    }
                    return;
                }

                // Hover Raycasting
                const rect = domElement.getBoundingClientRect();
                if (rect.width <= 0 || rect.height <= 0) return;

                pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(pointerNDC, camera);
                const hits = raycaster.intersectObjects(interactableMeshes, false);

                const labelEl = document.getElementById('hover-label');
                const textEl = document.getElementById('hover-text');

                if (hits.length > 0) {
                    const grp = hits[0].object.userData.interactGroup;
                    hoveredGroup = grp;
                    domElement.style.cursor = 'pointer';
                    textEl.textContent = grp.userData.interactLabel || '点击交互';
                    labelEl.style.left = `${e.clientX}px`;
                    labelEl.style.top = `${e.clientY}px`;
                    labelEl.style.opacity = '1';
                } else {
                    hoveredGroup = null;
                    domElement.style.cursor = 'grab';
                    labelEl.style.opacity = '0';
                }
            });

            window.addEventListener('pointerup', e => {
                const wasDragging = camControl.isDragging;
                camControl.isDragging = false;
                if (!wasDragging) return;

                const moveDist = Math.hypot(e.clientX - camControl.downX, e.clientY - camControl.downY);
                if (moveDist < 6 && hoveredGroup) {
                    const type = hoveredGroup.userData.interactType;
                    if (type === 'floorLamp') toggleFloorLamp();
                    else if (type === 'deskLamp') toggleDeskLamp();
                    else if (type === 'monitor') cycleMonitorTheme();
                    else if (type === 'chair') triggerChairSpin();
                    else if (type === 'blinds') toggleWindowBlinds();
                    else if (type === 'vinyl') toggleVinylPlayer();
                    else if (type === 'coffee') {
                        roomState.mugBounceTime = clock.getElapsedTime();
                        showToast('☕ 醇香热美式，为您注入满满创作活力！');
                    }
                }
            });

            domElement.addEventListener('wheel', e => {
                e.preventDefault();
                camControl.radius = Math.max(
                    camControl.minRadius,
                    Math.min(camControl.maxRadius, camControl.radius + e.deltaY * 0.008)
                );
            }, { passive: false });

            window.addEventListener('resize', checkAndResizeViewport);
        }

        function checkAndResizeViewport() {
            if (!renderer || !camera) return;
            const wrap = document.getElementById('canvas-wrap');
            const w = Math.max(wrap.clientWidth || window.innerWidth || 960, 320);
            const h = Math.max(wrap.clientHeight || window.innerHeight || 640, 280);
            const canvas = renderer.domElement;
            if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) {
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            }
        }

        let toastTimer = null;
        function showToast(text) {
            const pill = document.getElementById('toast-pill');
            if (!pill) return;
            pill.textContent = text;
            pill.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                pill.classList.remove('show');
            }, 2400);
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);

            checkAndResizeViewport();
            updateCameraTransform();

            const t = clock.getElapsedTime();

            // 1. Update Live Dual Monitor Screens
            renderMonitorCanvases(t);

            // 2. Spin RGB PC Fans
            animObjects.pcFans.forEach((fan, idx) => {
                fan.rotation.z = t * (4.5 + idx * 0.8);
            });

            // 3. Smooth Ergonomic Chair Rotation
            if (animObjects.chairTopGroup) {
                const targetYaw = Math.PI + roomState.chairTargetYaw;
                animObjects.chairTopGroup.rotation.y += (targetYaw - animObjects.chairTopGroup.rotation.y) * 0.1;
            }

            // 4. Smooth Venetian Blinds Slat Tilt
            const targetSlatAngle = roomState.blindsOpen ? 0.25 : 1.42;
            animObjects.blindsSlats.forEach(slat => {
                slat.rotation.z += (targetSlatAngle - slat.rotation.z) * 0.12;
            });

            // 5. Vinyl Turntable Rotation
            if (animObjects.vinylDisc && roomState.vinylPlaying) {
                animObjects.vinylDisc.rotation.y = -t * 2.2;
            }
            if (animObjects.vinylTonearm) {
                const targetArm = roomState.vinylPlaying ? 0.38 : 0.05;
                animObjects.vinylTonearm.rotation.z += (targetArm - animObjects.vinylTonearm.rotation.z) * 0.1;
            }

            // 6. Rising Coffee Steam & Mug Bounce
            animObjects.steamParticles.forEach(puff => {
                const cycle = (t * 0.48 + puff.userData.phase) % 1;
                puff.position.y = 0.15 + cycle * 0.26;
                puff.position.x = Math.sin(t * 2.8 + puff.userData.phase) * 0.022;
                puff.material.opacity = Math.sin(cycle * Math.PI) * 0.45;
            });

            if (animObjects.mugGroup) {
                if (t - roomState.mugBounceTime < 0.55) {
                    const p = (t - roomState.mugBounceTime) / 0.55;
                    animObjects.mugGroup.position.y = 0.49 + Math.sin(p * Math.PI) * 0.14;
                    animObjects.mugGroup.rotation.y = p * Math.PI * 2;
                } else {
                    animObjects.mugGroup.position.y = 0.49;
                    animObjects.mugGroup.rotation.y = 0;
                }
            }

            // 7. Cyberpunk Flowing RGB Desk Strip
            if (roomState.mode === 'cyber' && animObjects.deskRgbMat) {
                const hue = (t * 0.16) % 1;
                animObjects.deskRgbMat.color.setHSL(hue, 0.95, 0.6);
            }

            renderer.render(scene, camera);
        }

        // Bootstrapping on load
        window.addEventListener('DOMContentLoaded', () => {
            loadThreeJS(0, init3DStudio, () => {
                const badge = document.getElementById('engine-status');
                if (badge) {
                    badge.textContent = '3D 引擎加载失败，请检查网络';
                    badge.style.color = '#fca5a5';
                }
            });
        });
    </script>
</body>
</html>
